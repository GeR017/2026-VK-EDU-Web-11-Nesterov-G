<section class="question-full">
                    <div class="row g-3">
                        <div class="col-auto text-center" style="min-width: 100px;">
                            <div class="avatar-placeholder mb-2">Avatar</div>
                            <div class="vote-widget">
                                <button class="vote-btn">▲</button>
                                <span class="vote-count">{{ question.like_count}}</span>
                                <button class="vote-btn">▼</button>
                            </div>
                        </div>
                        <div class="col">
                            <h2 class="fw-bold mb-3">{{ question.title }}</h2>
                            <div class="text-muted small mb-2">
                Опубликовано: <strong>{{ question.creation_date|date:"d.m.Y H:i" }}</strong> | Автор: <span class="text-dark">{{ question.author.username }}</span>
            </div>
                            <p class="fs-5">
                                {{ question.text }}
                            </p>
                            <div class="mt-3">
                                <span class="fw-bold">Tags:</span>
                              {% for tag in question.tags.all %}
                                        <a href="{% url 'tag' tag.title %}" class="text-decoration-none text-info me-1">{{ tag.title }}</a>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                </section>
