version: '3.8'

services:
  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=ask_nesterov_db
      - POSTGRES_USER=nesterov_user
      - POSTGRES_PASSWORD=nesterov_password
      - POSTGRES_ENCODING=UTF-8
      - POSTGRES_LC_COLLATE=C
      - POSTGRES_LC_CTYPE=C
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nesterov_user -d ask_nesterov_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env.docker
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
